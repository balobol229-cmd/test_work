[project]
name = "checkstock"
version = "0.1.0"
description = "CheckStock: где сейчас товар — остатки по складам ФФ, резервы FBS, отгрузки FBO"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "hypothesis>=6.170.15",
]
load = [
    "locust>=2.47.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Предупреждение Starlette о будущей замене httpx в TestClient, к нашему коду не относится
    "ignore:.*starlette.testclient.*",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# pyflakes, pycodestyle, импорты, bugbear, pyupgrade и правила безопасности bandit
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert в тестах — это нормально

[tool.ruff.lint.per-file-ignores]
# Случайность здесь генерирует сценарии нагрузки и тестов, а не ключи и токены
"tests/*" = ["S311"]
"loadtest/*" = ["S311"]
