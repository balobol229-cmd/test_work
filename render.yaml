# Render Blueprint: бесплатный веб-сервис из Dockerfile и бесплатный PostgreSQL.
# Render → New → Blueprint → выбрать этот репозиторий.
databases:
  - name: checkstock-db
    plan: free
    databaseName: checkstock
    user: checkstock

services:
  - type: web
    name: checkstock
    runtime: docker
    plan: free
    healthCheckPath: /api/check
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: checkstock-db
          property: connectionString
